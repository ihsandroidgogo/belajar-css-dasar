<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Tailwind CSS</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="bg-blue-50 dark:bg-zinc-900">
   <div class="dark w-screen h-screen flex flex-col justify-center items-center gap-6 px-4">
    
    <div class="w-72 h-72 bg-[url(https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba)] bg-center bg-cover"></div>
    
    <!-- Pembungkus tombol: flex = menyamping -->
    <div class="flex flex-row gap-4">
        <button class="bg-blue-500 px-[20px] py-[10px] text-white rounded-lg hover:bg-blue-600 transition-colors duration-300" id="saveBtn">
            Save
        </button>
        <button class="bg-blue-500 px-[20px] py-[10px] text-white rounded-lg hover:bg-blue-600 transition-colors duration-300" id="downloadBtn">
            Download
        </button>
        <button class="bg-blue-500 px-[20px] py-[10px] text-white rounded-lg hover:bg-blue-600 transition-colors duration-300" id="uploadBtn">
            Upload
        </button>
    </div>

   </div>
</body>
</html>
